name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run pytest
        run: pytest -v
      - name: Verify JSON Schema is in sync with Pydantic
        run: |
          python tools/regen_schema.py
          if ! git diff --quiet schema/; then
            echo "::error::schema/ is out of sync with the Pydantic models."
            echo "Run 'python tools/regen_schema.py' locally and commit the diff."
            git diff schema/
            exit 1
          fi

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/bundle_spec
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo build
        run: cargo build --verbose
      - name: cargo test
        run: cargo test --verbose
      - name: cargo fmt check
        run: cargo fmt -- --check
      - name: cargo clippy (allow warnings for now)
        run: cargo clippy --all-targets

  cross-language-arrow-consistency:
    runs-on: ubuntu-latest
    needs: [python, rust]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Cross-language Arrow schema consistency
        run: python tools/compare_arrow_schemas.py
