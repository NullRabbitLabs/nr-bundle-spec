[project]
name = "bundle-spec"
version = "0.2.0"
description = "Bundle v1 — canonical multi-modal capture format for adversarial blockchain validator research."
authors = [{ name = "NullRabbit", email = "security@nullrabbit.ai" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "pyarrow>=17",
]
keywords = [
    "bundle",
    "format",
    "blockchain",
    "validator",
    "security",
    "detection",
    "training",
    "dataset",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/NullRabbitLabs/nr-bundle-spec"
Repository = "https://github.com/NullRabbitLabs/nr-bundle-spec"
Issues = "https://github.com/NullRabbitLabs/nr-bundle-spec/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "jsonschema>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/bundle_spec"]

[tool.hatch.build.targets.sdist]
include = [
    "python/bundle_spec",
    "schema",
    "examples",
    "tests",
    "tools",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "CITATION.cff",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["python", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["bundle_spec"]
mypy_path = "python"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
